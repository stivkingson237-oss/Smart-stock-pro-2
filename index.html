<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0A" />
<meta name="color-scheme" content="dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>SmartStock Pro</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --ink:#0A0A0A;
    --ink-2:#1F1F1F;
    --paper:#0A0A0A;
    --paper-2:#1A1A1A;
    --gold:#F97316;
    --gold-2:#FB923C;
    --green:#34D399;
    --red:#F87171;
    --line:#2E2E2E;
    --text:#FFFFFF;
    --text-strong:#FFFFFF;
    --on-ink:#FFFFFF;
    --text-dim:#B8B4AE;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 8px 20px rgba(0,0,0,.35);
    --shadow-hover:0 15px 30px rgba(0,0,0,.5);
    --font-display:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --font-mono:'Courier New',Consolas,monospace;
  }
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:dark;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font-body);
    background:var(--paper);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  #root{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
  ::selection{background:var(--gold-2);color:var(--ink);}
  button,input,select{font-family:inherit;}

  /* ---------- Ticker (signature element) ---------- */
  .ticker{
    background:var(--ink);
    color:var(--on-ink);
    overflow:hidden;
    white-space:nowrap;
    position:relative;
    height:34px;
    border-bottom:1px solid var(--gold);
    flex-shrink:0;
  }
  .ticker-track{
    display:inline-flex;
    align-items:center;
    height:100%;
    animation:ticker-scroll 22s linear infinite;
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.02em;
  }
  .ticker-item{padding:0 24px;display:flex;align-items:center;gap:8px;color:#D8CFBB;}
  .ticker-item b{color:var(--gold-2);font-weight:600;}
  .ticker-dot{width:4px;height:4px;border-radius:50%;background:var(--gold);display:inline-block;}
  @keyframes ticker-scroll{
    0%{transform:translateX(0);}
    100%{transform:translateX(-50%);}
  }
  .ticker-empty{display:flex;align-items:center;height:100%;padding-left:24px;font-family:var(--font-mono);font-size:12px;color:#8A8371;}

  /* ---------- Login ---------- */
  .login-screen{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(249,115,22,0.15), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(30,58,138,0.25), transparent 40%),
      var(--ink);
    color:var(--on-ink);
    padding:24px;
    text-align:center;
  }
  .brand{
    font-family:var(--font-display);font-weight:800;font-size:38px;letter-spacing:-0.01em;
    display:flex;align-items:baseline;gap:2px;justify-content:center;
  }
  .brand .accent{color:var(--gold-2);}
  .brand-sub{
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.25em;text-transform:uppercase;
    color:#9A927D;margin-top:8px;
  }
  .login-cards{display:flex;gap:16px;margin-top:48px;flex-wrap:wrap;justify-content:center;}
  .login-card{
    width:220px;background:rgba(255,255,255,0.04);border:1px solid rgba(249,115,22,0.3);
    border-radius:var(--radius);padding:28px 20px;cursor:pointer;transition:.3s;
    text-align:left;
  }
  .login-card:hover{background:rgba(249,115,22,0.12);border-color:var(--gold);transform:translateY(-4px);box-shadow:var(--shadow-hover);}
  .login-card .role-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.15em;color:var(--gold-2);text-transform:uppercase;}
  .login-card h3{font-family:var(--font-display);font-size:20px;margin-top:10px;font-weight:700;}
  .login-card p{font-size:12.5px;color:#A9A18D;margin-top:6px;line-height:1.5;}

  .login-form{margin-top:36px;width:100%;max-width:320px;text-align:left;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:var(--font-mono);font-size:11px;color:#A9A18D;margin-bottom:6px;letter-spacing:0.05em;}
  .field select, .field input{
    width:100%;padding:14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);
    border-radius:var(--radius-sm);color:#fff;font-size:14px;transition:.3s;
  }
  .field select:focus, .field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 10px rgba(249,115,22,.3);}
  .field select option{color:#000;}
  .field input::placeholder{color:#8A8371;}
  .btn{
    font-weight:800;font-size:13.5px;text-transform:uppercase;letter-spacing:0.04em;border:none;border-radius:var(--radius-sm);
    padding:14px 22px;cursor:pointer;transition:.3s;
  }
  .btn-primary{background:var(--gold);color:#0A0A0A;width:100%;margin-top:8px;}
  .btn-primary:hover{background:var(--gold-2);box-shadow:0 6px 16px rgba(249,115,22,0.35);}
  .btn-ghost{background:transparent;color:#A9A18D;border:1px solid rgba(255,255,255,0.15);}
  .btn-ghost:hover{color:var(--gold);border-color:var(--gold);}
  .login-error{color:#E8897A;font-size:12.5px;margin-top:10px;font-family:var(--font-mono);}
  .back-link{margin-top:20px;font-size:12.5px;color:#8A8371;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}

  /* ---------- App shell ---------- */
  .app-shell{flex:1;display:flex;min-height:0;}
  .sidebar{
    width:220px;flex-shrink:0;background:var(--ink);color:var(--on-ink);
    display:flex;flex-direction:column;padding:20px 0;
  }
  .sidebar-brand{padding:0 20px 20px;font-family:var(--font-display);font-weight:800;font-size:20px;border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:12px;}
  .sidebar-brand .accent{color:var(--gold-2);}
  .nav-item{
    padding:11px 20px;font-size:13.5px;font-weight:500;color:#B7AF9B;cursor:pointer;
    display:flex;align-items:center;gap:10px;border-left:2px solid transparent;
  }
  .nav-item:hover{color:var(--on-ink);background:rgba(255,255,255,0.03);}
  .nav-item.active{color:var(--on-ink);border-left-color:var(--gold);background:rgba(232,170,78,0.08);}
  .nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-family:var(--font-mono);padding:1px 6px;border-radius:10px;}
  .home-btn{
    margin:0 20px 14px;padding:10px 14px;background:var(--gold);color:#0A0A0A;font-weight:700;font-size:13px;
    border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;gap:8px;transition:.2s;
  }
  .home-btn:hover{background:var(--gold-2);}
  .sidebar-footer{margin-top:auto;padding:14px 20px 0;border-top:1px solid rgba(255,255,255,0.08);}
  .sidebar-user{font-size:12.5px;color:#A9A18D;}
  .sidebar-user b{color:var(--on-ink);display:block;font-size:13.5px;font-family:var(--font-display);}
  .logout-btn{margin-top:10px;font-size:12px;color:#8A8371;cursor:pointer;text-decoration:underline;}

  .boutique-switch{padding:0 20px 14px;}
  .boutique-switch select{
    width:100%;background:rgba(255,255,255,0.06);color:var(--on-ink);border:1px solid rgba(255,255,255,0.15);
    border-radius:3px;padding:8px 10px;font-size:12.5px;
  }

  .main{flex:1;overflow-y:auto;padding:28px 32px;min-width:0;}
  .page-title{font-family:var(--font-display);font-weight:700;font-size:24px;margin-bottom:4px;color:var(--text-strong);}
  .page-sub{font-size:13px;color:var(--text-dim);margin-bottom:24px;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:28px;}
  .stat-card{
    position:relative;background:var(--paper-2);border:1px solid var(--line);
    -webkit-clip-path:polygon(18px 0,100% 0,100% 100%,0 100%,0 18px);clip-path:polygon(18px 0,100% 0,100% 100%,0 100%,0 18px);
    border-radius:2px 14px 14px 14px;padding:22px 22px 22px 26px;box-shadow:var(--shadow);transition:.3s;
  }
  .stat-card::before{
    content:"";position:absolute;top:9px;left:9px;width:7px;height:7px;border-radius:50%;
    background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);
  }
  .stat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:rgba(249,115,22,0.35);}
  .stat-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim);}
  .stat-value{font-family:var(--font-mono);font-weight:700;font-size:26px;margin-top:8px;color:var(--text-strong);}
  .stat-value.gold{color:var(--gold);}
  .stat-value.green{color:var(--green);}
  .stat-value.red{color:var(--red);}
  .stat-delta{font-size:11.5px;margin-top:4px;color:var(--text-dim);}

  .panel{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px;box-shadow:var(--shadow);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;}
  .panel-head{padding:14px 18px;border-bottom:2px solid var(--gold);display:flex;align-items:center;justify-content:space-between;}
  .panel-head h3{font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--text-strong);}
  .panel-body{padding:14px 18px;overflow-x:auto;-webkit-overflow-scrolling:touch;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:#fff;background:var(--ink);padding:13px 15px;border-bottom:2px solid var(--gold);}
  td{padding:13px 15px;border-bottom:1px solid var(--line);font-size:13px;}
  tr:nth-child(even) td{background:rgba(255,255,255,0.015);}
  tr:hover td{background:rgba(249,115,22,0.06);}
  tr:last-child td{border-bottom:none;}
  .num{font-family:var(--font-mono);color:var(--text);}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;font-family:var(--font-mono);}
  .tag-low{background:rgba(248,113,113,0.15);color:var(--red);}
  .tag-ok{background:rgba(52,211,153,0.15);color:var(--green);}

  .btn-sm{font-size:11.5px;padding:8px 13px;background:var(--ink);color:#fff;border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-sm);cursor:pointer;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;transition:.3s;}
  .btn-sm:hover{background:var(--gold);border-color:var(--gold);color:#0A0A0A;}
  .btn-sm.danger{background:transparent;color:var(--red);border:1px solid var(--red);}
  .btn-sm.danger:hover{background:var(--red);color:#fff;}
  .btn-gold{background:var(--gold);color:#0A0A0A;border:none;border-radius:var(--radius-sm);padding:12px 22px;font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:0.05em;cursor:pointer;transition:.3s;}
  .btn-gold:hover{background:var(--gold-2);box-shadow:0 6px 16px rgba(249,115,22,0.35);}
  .btn-gold[disabled]{opacity:0.5;cursor:not-allowed;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.04em;}
  .form-field input,.form-field select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:13.5px;background:var(--paper-2);color:var(--text);transition:.3s;}
  .form-field input:focus,.form-field select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 10px rgba(249,115,22,.25);}

  .pos-layout{display:flex;gap:20px;height:calc(100vh - 120px);height:calc(100dvh - 120px);}
  .pos-search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:15px;margin-bottom:14px;color:var(--text);background:var(--paper-2);transition:.3s;}
  .pos-search:focus{outline:none;border-color:var(--gold);box-shadow:0 0 10px rgba(249,115,22,.25);}
  .pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;overflow-y:auto;padding-right:6px;flex:1;align-content:start;}
  .prod-card{
    position:relative;background:var(--paper-2);border:1px solid var(--line);
    -webkit-clip-path:polygon(16px 0,100% 0,100% 100%,0 100%,0 16px);clip-path:polygon(16px 0,100% 0,100% 100%,0 100%,0 16px);
    border-radius:2px 12px 12px 12px;padding:14px 14px 14px 18px;cursor:pointer;transition:.3s;box-shadow:var(--shadow);
  }
  .prod-card::before{
    content:"";position:absolute;top:8px;left:8px;width:6px;height:6px;border-radius:50%;
    background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);
  }
  .prod-card:hover{border-color:var(--gold);transform:translateY(-4px);box-shadow:var(--shadow-hover);}
  .prod-card.disabled{opacity:0.4;cursor:not-allowed;}
  .prod-card .pname{font-weight:600;font-size:13px;margin-bottom:4px;color:var(--text-strong);}
  .prod-card .pcode{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);}
  .prod-card .pprice{font-family:var(--font-mono);font-weight:700;color:var(--gold);margin-top:8px;font-size:14px;}
  .prod-card .pstock{font-size:10.5px;color:var(--text-dim);margin-top:2px;}

  .cart-panel{width:320px;flex-shrink:0;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden;}
  .cart-head{padding:14px 16px;border-bottom:1px solid var(--line);font-family:var(--font-display);font-weight:700;}
  .cart-items{flex:1;overflow-y:auto;padding:10px 16px;}
  .cart-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .cart-item .qty-ctl{display:flex;align-items:center;gap:6px;}
  .qty-btn{width:24px;height:24px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--text);cursor:pointer;font-size:14px;line-height:1;}
  .cart-total{padding:14px 16px;border-top:1px solid var(--line);}
  .cart-total-row{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:14px;margin-bottom:10px;}
  .cart-total-row b{font-size:18px;color:var(--gold);}
  .cart-empty{color:var(--text-dim);font-size:13px;text-align:center;padding:30px 10px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:14px 22px;border-radius:var(--radius-sm);
    font-size:13.5px;border:1px solid var(--gold);z-index:999;font-family:var(--font-mono);
    box-shadow:var(--shadow-hover);
  }

  .modal-overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(42,36,56,0.4);display:flex;align-items:center;justify-content:center;z-index:998;padding:20px;}
  .modal{background:var(--paper-2);border-radius:var(--radius);width:100%;max-width:440px;max-height:88vh;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow-hover);}
  .modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .modal-head h3{font-family:var(--font-display);font-size:16px;}
  .modal-close{cursor:pointer;color:var(--text-dim);font-size:18px;}
  .modal-body{padding:18px 20px;}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

  .empty-state{text-align:center;padding:40px 20px;color:var(--text-dim);}
  .empty-state .icon{font-size:32px;margin-bottom:10px;}

  @media (max-width:820px){
    .app-shell{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;align-items:center;padding:10px 12px;overflow-x:auto;}
    .sidebar-brand{display:none;}
    .boutique-switch{display:none;}
    .sidebar-footer{display:none;}
    .nav-item{padding:8px 12px;border-left:none;border-bottom:2px solid transparent;white-space:nowrap;}
    .nav-item.active{border-bottom-color:var(--gold);border-left-color:transparent;}
    .home-btn{margin:0 6px 0 0;padding:8px 12px;white-space:nowrap;flex-shrink:0;}
    .main{padding:18px 16px;}
    .pos-layout{flex-direction:column;height:auto;}
    .cart-panel{width:100%;}
    .form-grid{grid-template-columns:1fr;}
    /* Barre du haut : garder boutique + déconnexion accessibles */
    .sidebar{position:-webkit-sticky;position:sticky;top:0;z-index:50;gap:2px;-webkit-overflow-scrolling:touch;padding-top:calc(10px + env(safe-area-inset-top,0px));}
    .boutique-switch{display:block;padding:0;margin-right:6px;flex-shrink:0;}
    .boutique-switch select{width:auto;max-width:150px;}
    .sidebar-footer{display:flex;align-items:center;margin:0 0 0 auto;padding:0 0 0 8px;border-top:none;flex-shrink:0;}
    .sidebar-user{display:none;}
    .logout-btn{margin:0;white-space:nowrap;padding:8px 12px;border:1px solid rgba(255,255,255,0.2);border-radius:10px;text-decoration:none;color:#D8D2C2;}
    .pos-grid{max-height:45vh;max-height:45dvh;}
    /* 16px min : évite le zoom automatique d'iOS dans les champs */
    input,select,textarea,.pos-search{font-size:16px !important;}
    table{min-width:520px;}
    .login-card{width:100%;max-width:340px;}
  }
  @media (max-width:480px){
    .main{padding:14px 12px;}
    .stat-grid{grid-template-columns:1fr 1fr;gap:10px;}
    .stat-card{padding:16px 14px 16px 18px;}
    .stat-value{font-size:19px;}
    .page-title{font-size:20px;}
    .brand{font-size:30px;}
    .modal-overlay{padding:10px;align-items:flex-end;}
    .modal-foot{flex-wrap:wrap;}
    .panel-head{flex-wrap:wrap;gap:8px;}
  }

  /* Tactile / accessibilité / encoches */
  button,.nav-item,.home-btn,[data-click]{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  .nav-item,.home-btn,.btn,.btn-sm,.btn-gold,.logout-btn{min-height:40px;}
  .toast{max-width:calc(100% - 32px);text-align:center;bottom:calc(24px + env(safe-area-inset-bottom,0px));}
  .main{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));}
  @media (hover:none){
    .stat-card:hover,.prod-card:hover,.login-card:hover{transform:none;}
  }
  @media (prefers-reduced-motion:reduce){
    .ticker-track{animation:none;}
    *{transition:none !important;}
  }
</style>
</head>

  admin: "Patron",
  gestionnaire: "Gestionnaire de stock",

};
var ROLE_LETTERS = { gestionnaire: "G", vendeur: "V", caissier: "C" };

function genEmployeeCode(boutiqueCode, role, existingCodes){
  var prefix = (boutiqueCode || "BT").split("-")[0];
  var letter = ROLE_LETTERS[role] || "X";
  var code, tries = 0;
  do {
    var num = 1001 + Math.floor(Math.random() * 8999); // nombre aléatoire 1001-9999
    var suffix = String.fromCharCode(65 + Math.floor(Math.random() * 26)); // lettre aléatoire A-Z
    code = prefix + "-" + num + "-" + letter + suffix;
    tries++;
  } while (existingCodes.indexOf(code) > -1 && tries < 5000);
  return code;
}

function genBoutiqueCode(name, existingCodes){
  var letter = (name||"X").trim().replace(/^Boutique\s*/i,"").charAt(0).toUpperCase() || "X";
  var n = 1001;
  var code;
  do {
    code = "BT" + letter + "-" + n;
    n++;
  } while (existingCodes.indexOf(code) > -1 && n < 9999);
  return code;
}

function genEntrepriseCode(paysCode){
  var digits = 100000 + Math.floor(Math.random()*900000);
  return "SSP-" + (paysCode||"XX") + "-" + digits;
}

function loadData(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      var d = JSON.parse(raw);
      var before = JSON.stringify(d);
      migrateData(d);
      if (JSON.stringify(d) !== before){
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }catch(e2){}
      }
      return d;
    }
  }catch(e){}
  return null;
}
function migrateData(d){
  if (!d.stockMovements) d.stockMovements = [];
  if (!d.cashMovements) d.cashMovements = [];
  if (!d.adminUsername) d.adminUsername = "admin";
  if (!d.devise) d.devise = "FCFA";
  if (!d.entrepriseId) d.entrepriseId = uid();
  if (!d.entrepriseCode) d.entrepriseCode = genEntrepriseCode("XX");
  if (!d.entrepriseName) d.entrepriseName = "Mon entreprise";
  var existingCodes = (d.boutiques||[]).map(function(b){return b.code;}).filter(Boolean);
  (d.boutiques||[]).forEach(function(b){
    if (!b.code){
      b.code = genBoutiqueCode(b.name, existingCodes);
      existingCodes.push(b.code);
    }
  });
  (d.employees||[]).forEach(function(e){
    if (!e.role) e.role = "vendeur";
    if (e.role === "responsable" || e.role === "manageur") e.role = "gestionnaire";
    if (!e.username) e.username = (e.name||"user").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,12) || uid().slice(0,6);
    if (e.password === undefined) e.password = e.pin || "0000";
  });
  if (d.cloud && d.cloud.linked && !d.cloud.boutiqueMap){
    d.cloud.boutiqueMap = {};
    if (d.cloud.localBoutiqueId && d.cloud.boutiqueId){
      d.cloud.boutiqueMap[d.cloud.localBoutiqueId] = d.cloud.boutiqueId;
    }
  }
}

function tickerHTML(sales, products, boutiques){
  var recent = sales.slice(-8).reverse();
  if (recent.length === 0){
    return '<div class="ticker"><div class="ticker-empty">EN ATTENTE DE VENTES — le flux en direct apparaîtra ici dès la première vente validée</div></div>';
  }
  var items = recent.map(function(s){
    var p = products.filter(function(x){ return x.id===s.productId; })[0];
    var b = boutiques.filter(function(x){ return x.id===s.boutiqueId; })[0];
    return { s:s, pname: p?p.name:"Produit supprimé", bname: b?b.name:"" };
  });
  var doubled = items.concat(items);
  var html = doubled.map(function(it){
    var isReturn = it.s.type==="retour";
    var icon = isReturn ? '🔄' : '🟢';
    var label = isReturn ? 'Retour' : 'Vente';
    return '<span class="ticker-item">'+icon+' <b>'+esc(it.bname)+'</b> · '+label+': '+esc(it.pname)+' ×'+Math.abs(it.s.qty)+' — '+fmt(it.s.total)+' '+curr()+'</span>';
  }).join("");
  return '<div class="ticker"><div class="ticker-track">'+html+'</div></div>';
}

window.__ss_handleLogoFile = function(input){
  var file = input.files && input.files[0];
  if (!file) return;
  if (!file.type || file.type.indexOf("image/") !== 0){ toast("Fichier non supporté"); return; }
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var maxDim = 300;
      var w = img.width, h = img.height;
      if (w > h){ if (w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else { if (h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      state.onboardingLogo = canvas.toDataURL("image/jpeg", 0.75);
      var preview = document.getElementById("ob_logo_preview");
      if (preview) preview.innerHTML = '<img src="'+state.onboardingLogo+'" style="width:100%;height:100%;object-fit:cover;" />';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
};

function statCard(label, value, cls, delta){

function viewOverview(){
  var d = state.data, ab = state.activeBoutiqueId;
  var scope = ab==="all" ? d.products : d.products.filter(function(p){ return p.boutiqueId===ab; });
  var salesScope = ab==="all" ? d.sales : d.sales.filter(function(s){ return s.boutiqueId===ab; });
  var today = todayKey(nowISO());
  var salesToday = salesScope.filter(function(s){ return todayKey(s.timestamp)===today; });
  var caToday = salesToday.reduce(function(s,x){ return s+x.total; },0);
  var beneficeToday = salesToday.reduce(function(sum,s){
    var p = d.products.filter(function(x){ return x.id===s.productId; })[0];
    if (!p) return sum;
    return sum + (p.prixVente - p.prixAchat) * s.qty;
  },0);
  var ruptures = scope.filter(function(p){ return p.qty <= p.seuilMin; });
  var stockValue = scope.reduce(function(s,p){ return s + p.qty*p.prixVente; },0);
  var boutiqueName = ab!=="all" ? (d.boutiques.filter(function(b){return b.id===ab;})[0]||{}).name : null;

  var html = '<div class="page-title">Vue d\'ensemble</div>';
  html += '<div class="page-sub">Activité en direct — '+(boutiqueName?esc(boutiqueName):"toutes boutiques")+' · cliquez sur un montant pour le masquer</div>';
  html += '<div class="stat-grid">';
  var maskable = function(v){ return '<span class="mask-toggle" data-real="'+esc(v)+'" data-shown="1" onclick="window.__ss_toggleMask(this)" style="cursor:pointer;">'+esc(v)+'</span>'; };
  html += statCard("Chiffre d'affaires — aujourd'hui", maskable(fmt(caToday)+' '+curr()), 'gold', salesToday.length+' vente(s)');
  html += statCard("Bénéfice — aujourd'hui", maskable(fmt(beneficeToday)+' '+curr()), 'green');
  html += statCard("Valeur du stock", maskable(fmt(stockValue)+' '+curr()), '', 'au prix de vente · '+scope.length+' produits');
  html += statCard("Produits en rupture / stock bas", ruptures.length, 'red', 'sur '+scope.length+' produits');
  html += statCard("Employés", d.employees.filter(function(e){return ab==="all"||e.boutiqueId===ab;}).length, '', d.boutiques.length+' boutique(s) actives');
  html += '</div>';

  if (ab === "all"){
    html += '<div class="panel"><div class="panel-head"><h3>Comparaison des boutiques (aujourd\'hui)</h3></div><div class="panel-body" style="padding:0"><table><thead><tr><th>Boutique</th><th>Ventes</th><th>Chiffre d\'affaires</th></tr></thead><tbody>';
    d.boutiques.forEach(function(b){
      var bSales = d.sales.filter(function(s){ return s.boutiqueId===b.id && todayKey(s.timestamp)===today; });
      var ca = bSales.reduce(function(s,x){return s+x.total;},0);
      html += '<tr><td>'+esc(b.name)+'</td><td class="num">'+bSales.length+'</td><td class="num">'+maskable(fmt(ca)+' '+curr())+'</td></tr>';
    });
    html += '</tbody></table></div></div>';
  }

  html += '<div class="panel"><div class="panel-head"><h3>Alertes stock</h3></div><div class="panel-body" style="padding:0"><table><thead><tr><th>Produit</th><th>Boutique</th><th>Stock</th><th>Seuil min.</th></tr></thead><tbody>';
  if (ruptures.length===0){
    html += '<tr><td colspan="4"><div class="empty-state">Aucune alerte — tout est sous contrôle ✓</div></td></tr>';
  } else {
    ruptures.forEach(function(p){
      var bn = (d.boutiques.filter(function(b){return b.id===p.boutiqueId;})[0]||{}).name;
      html += '<tr><td>'+esc(p.name)+'</td><td>'+esc(bn)+'</td><td class="num" style="color:var(--red)">'+p.qty+'</td><td class="num">'+p.seuilMin+'</td></tr>';
    });
  }
  html += '</tbody></table></div></div>';
  return html;
}

window.__ss_handleEntLogoFile = function(input){
  var file = input.files && input.files[0];
  if (!file) return;
  if (!file.type || file.type.indexOf("image/") !== 0){ toast("Fichier non supporté"); return; }
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var maxDim = 300;
      var w = img.width, h = img.height;
      if (w > h){ if (w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else { if (h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      state.data.entrepriseLogo = canvas.toDataURL("image/jpeg", 0.75);
      saveData();
      var preview = document.getElementById("ent_logo_preview");
      if (preview) preview.innerHTML = '<img src="'+state.data.entrepriseLogo+'" style="width:100%;height:100%;object-fit:cover;" />';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
};

function viewHistoriquePerso(){
  var d = state.data, u = state.user;
  var mine = d.sales.filter(function(s){ return s.employeeId===u.employeeId; }).slice().reverse();
  var html = '<div class="page-title">Mon historique</div><div class="page-sub">Vos ventes et retours enregistrés</div>';
  html += '<div class="panel"><div class="panel-body" style="padding:0"><table><thead><tr><th>Date</th><th>Type</th><th>Produit</th><th>Qté</th><th>Montant</th><th></th></tr></thead><tbody>';
  if (mine.length===0){
    html += '<tr><td colspan="6"><div class="empty-state">Aucune vente pour l\'instant</div></td></tr>';
  } else {
    mine.forEach(function(s){
      var p = d.products.filter(function(x){return x.id===s.productId;})[0];
      var isReturn = s.type==="retour";
      var typeTag = isReturn ? '<span class="tag" style="background:rgba(248,113,113,0.15);color:var(--red);">🔄 Retour</span>' : '<span class="tag tag-ok">🟢 Vente</span>';
      html += '<tr><td>'+new Date(s.timestamp).toLocaleString("fr-FR")+'</td><td>'+typeTag+'</td><td>'+esc(p?p.name:"Produit supprimé")+'</td><td class="num">'+Math.abs(s.qty)+'</td><td class="num">'+fmt(s.total)+' '+curr()+'</td>';
      if (isReturn){
        html += '<td></td></tr>';
      } else if (s.returned){
        html += '<td><span class="tag" style="background:rgba(255,255,255,0.1);color:var(--text-dim);">Retourné</span></td></tr>';
      } else {
        html += '<td><button class="btn-sm danger" data-click="returnSale" data-id="'+s.id+'">Retour</button></td></tr>';
      }
    });
  }
  html += '</tbody></table></div></div>';

  var myCashOuts = d.cashMovements.filter(function(c){ return c.employeeId===u.employeeId; }).slice().reverse();
  html += '<div class="panel"><div class="panel-head"><h3>💸 Mes sorties de caisse</h3></div><div class="panel-body" style="padding:0"><table><thead><tr><th>Date</th><th>Motif</th><th>Montant</th></tr></thead><tbody>';
  if (myCashOuts.length===0){
    html += '<tr><td colspan="3"><div class="empty-state">Aucune sortie enregistrée</div></td></tr>';
  } else {
    myCashOuts.forEach(function(c){
      html += '<tr><td>'+new Date(c.timestamp).toLocaleString("fr-FR")+'</td><td>'+esc(c.motif)+'</td><td class="num" style="color:var(--red);">−'+fmt(c.amount)+' '+curr()+'</td></tr>';
    });
  }
  html += '</tbody></table></div></div>';
  return html;
}

// ---------------- Root render ----------------
function render(){
  var root = document.getElementById("root");
  try{
    if (state.remote && state.remote.active){
      root.innerHTML = renderRemote();
    } else if (!state.user){
      root.innerHTML = renderLogin();
    } else if (state.user.role === "admin"){
      root.innerHTML = renderAdmin();
    } else if (state.user.role === "gestionnaire"){
      root.innerHTML = renderGestionnaire();
    } else {
      root.innerHTML = renderEmploye();
    }
  } catch(err){
    root.innerHTML =
      '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ink);color:#fff;padding:24px;text-align:center;">' +
      '<div style="font-family:var(--font-display);font-weight:800;font-size:20px;margin-bottom:10px;">Une erreur est survenue</div>' +
      '<div style="font-family:var(--font-mono);font-size:12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:14px;max-width:500px;white-space:pre-wrap;text-align:left;margin-bottom:16px;">' + esc(err && err.message ? err.message : String(err)) + '</div>' +
      '<button class="btn btn-primary" style="width:auto;" onclick="window.__ss_recover()">Retour à la connexion</button>' +
      '</div>';
  }
  var posSearch = document.getElementById("posSearch");
  var coarse = false;
  try{ coarse = !!(window.matchMedia && window.matchMedia("(pointer:coarse)").matches); }catch(e){}
  if (posSearch && !coarse){ try{ posSearch.focus({preventScroll:true}); }catch(e){ posSearch.focus(); } }
}

  state.user = null;

};

window.__ss_toggleMask = function(el){
  var shown = el.getAttribute("data-shown") === "1";
  if (shown){
    el.textContent = "••••••";
    el.setAttribute("data-shown", "0");
  } else {
    el.textContent = el.getAttribute("data-real");
    el.setAttribute("data-shown", "1");
  }
};

window.__ss_autofillBoutiqueCode = function(idCode){
  if (!state.data) return;
  var id = (idCode||"").trim().toLowerCase();
  var boutiqueField = document.getElementById("loginBoutiqueCode");
  if (!boutiqueField) return;
  if (!id){ return; }
  var emp = state.data.employees.filter(function(e){ return (e.username||"").toLowerCase()===id; })[0];
  if (emp){
    var b = state.data.boutiques.filter(function(x){ return x.id===emp.boutiqueId; })[0];
    if (b) boutiqueField.value = b.code;
  }
};

window.__ss_filterPos = function(q){
  q = (q||"").toLowerCase();
  var grid = document.getElementById("posGrid");
  if (!grid) return;
  var cards = grid.querySelectorAll(".prod-card");
  cards.forEach(function(card){
    var name = card.getAttribute("data-name")||"";
    var code = card.getAttribute("data-code")||"";
    card.style.display = (name.indexOf(q)>-1 || code.indexOf(q)>-1) ? "" : "none";
  });
};

window.__ss_handlePhotoFile = function(input){
  var file = input.files && input.files[0];
  if (!file) return;
  if (!file.type || file.type.indexOf("image/") !== 0){
    toast("Fichier non supporté — choisissez une image");
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var maxDim = 480;
      var w = img.width, h = img.height;
      if (w > h){ if (w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
      else { if (h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      var dataUrl = canvas.toDataURL("image/jpeg", 0.72);
      state.modalPhoto = dataUrl;
      var preview = document.getElementById("pf_photo_preview");
      if (preview) preview.innerHTML = '<img src="'+dataUrl+'" style="width:100%;height:100%;object-fit:cover;" />';
      var removeWrap = document.getElementById("pf_photo_remove_wrap");
      if (removeWrap) removeWrap.innerHTML = '<span class="back-link" style="margin:0;color:var(--red);" data-click="removePhoto">Supprimer la photo</span>';
    };
    img.onerror = function(){ toast("Impossible de lire cette image"); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ toast("Erreur de lecture du fichier"); };
  reader.readAsDataURL(file);
};

// ---------------- Synchronisation cloud (best-effort, ne bloque jamais l'usage local) ----------------
async function trySyncPatronToCloud(ob, localBoutiqueId, fullName){
  if (!isOnline()) return;
  var sb = getSb();
  state.cloudError = null;
  if (!sb){ state.cloudError = "La bibliothèque cloud (Supabase) ne s'est pas chargée : internet est peut-être bloqué pour l'appli, ou le réseau était coupé au démarrage. Fermez et rouvrez l'appli, puis réessayez."; return; }
  try{
    var res = await sb.functions.invoke('signup-patron', { body: {
      full_name: fullName, username: ob.username, telephone: ob.telephone,
      email: ob.email || undefined, password: cp(ob.password), pays: ob.pays,
      entreprise_name: ob.entreprise, devise: ob.devise,
      boutique_name: ob.boutique, boutique_address: ob.adresse || undefined
    }});
    if (res.error || !res.data || !res.data.ok) throw (res.error || new Error("signup failed"));
    var d = res.data;
    var signIn = await sb.auth.signInWithPassword({ email: d.login_email, password: cp(ob.password) });
    if (signIn.error) throw signIn.error;
    if (state.data){
      state.data.cloud = { linked:true, loginEmail:d.login_email, businessId:d.business_id, boutiqueMap:{} };
      state.data.cloud.boutiqueMap[localBoutiqueId] = d.boutique_id;
      saveData();
      toast("Compte synchronisé avec le cloud ✓");
    }
  }catch(e){
    var msg = (e && e.message) || "erreur inconnue";
    try{
      if (e && e.context && typeof e.context.json === "function"){
        var j = await e.context.json();
        msg = ((j && (j.error || j.message)) || msg) + " (code " + e.context.status + ")";
      }
    }catch(_e){}
    state.cloudError = msg;
    console.log("Synchronisation cloud (inscription) impossible pour l'instant :", e);
  }
}

// Un produit/vente/mouvement n'est synchronisable que s'il appartient à la boutique
// déjà connue du cloud (la toute première créée à l'inscription, pour l'instant).
function cloudBoutiqueIdFor(boutiqueLocalId){
  if (!state.data || !state.data.cloud || !state.data.cloud.linked) return null;
  return (state.data.cloud.boutiqueMap && state.data.cloud.boutiqueMap[boutiqueLocalId]) || null;
}
function cloudEligible(boutiqueLocalId){
  return isOnline() && !!cloudBoutiqueIdFor(boutiqueLocalId);
}

async function trySyncProductToCloud(localProduct){
  var cloudBId = cloudBoutiqueIdFor(localProduct.boutiqueId);
  if (!isOnline() || !cloudBId) return;
  var sb = getSb();
  if (!sb) return;
  try{
    var row = {
      business_id: state.data.cloud.businessId,
      boutique_id: cloudBId,
      name: localProduct.name, code: localProduct.code, category: localProduct.category,
      purchase_price: localProduct.prixAchat, sale_price: localProduct.prixVente,
      qty: localProduct.qty, min_stock: localProduct.seuilMin, supplier: localProduct.fournisseur
    };
    if (localProduct.cloudId){
      var upd = await sb.from('products').update(row).eq('id', localProduct.cloudId);
      if (upd.error) throw upd.error;
    } else {
      var ins = await sb.from('products').insert(row).select('id').single();
      if (ins.error) throw ins.error;
      localProduct.cloudId = ins.data.id;
      saveData();
    }
  }catch(e){
    console.log("Synchronisation cloud (produit) impossible pour l'instant :", e);
  }
}

async function doInitiatePayment(provider){
  var sb = getSb();
  if (!sb || !state.data || !state.data.cloud || !state.data.cloud.linked){ toast("Compte non lié au cloud"); return; }
  var planCode = document.getElementById("sub_plan_code").value;
  var billingCycle = document.getElementById("sub_billing_cycle").value;
  var body = { business_id: state.data.cloud.businessId, plan_code: planCode, billing_cycle: billingCycle, provider: provider };
  if (provider === "mtn"){
    var phone = (document.getElementById("sub_mtn_phone").value||"").trim();
    if (!phone){ toast("Entrez votre numéro MTN"); return; }
    body.phone = phone;
  }
  toast("Initiation du paiement...");
  try{
    var res = await sb.functions.invoke('initiate-payment', { body: body });
    if (res.error || !res.data || !res.data.ok) throw (res.error || new Error((res.data && res.data.error) || "Échec"));
    if (res.data.provider === "orange" && res.data.payment_url){

    } else if (res.data.provider === "mtn"){
      toast("📱 Validez le paiement sur votre téléphone MTN, puis actualisez votre statut.");
    }
  }catch(e){
    toast("Échec du paiement : "+((e && e.message) || "réessayez plus tard"));
  }
}

async function doLoadRemoteDashboard(){
  var sb = getSb();
  if (!sb || !state.data || !state.data.cloud || !state.data.cloud.linked){
    state.remoteDashboard = { error: "Compte non lié au cloud", fetchedAt: nowISO() };
    render();
    return;
  }
  try{
    var businessId = state.data.cloud.businessId;
    var todayStart = new Date(); todayStart.setHours(0,0,0,0);

    var boutiquesRes = await sb.from('boutiques').select('id, name, code').eq('business_id', businessId);
    if (boutiquesRes.error) throw boutiquesRes.error;

    var membershipsRes = await sb.from('memberships').select('full_name, role, identification_code, last_login_at').eq('business_id', businessId).neq('role','owner').order('last_login_at', { ascending:false });
    if (membershipsRes.error) throw membershipsRes.error;

    if (salesRes.error) throw salesRes.error;

    if (lowStockRes.error) throw lowStockRes.error;

      boutiques: boutiquesRes.data || [],

    };

  }

    html += '<div class="page-title" style="margin:0;">📡 Mon activité</div><div style="display:flex;gap:8px;"><button class="btn-gold" data-click="remoteRefresh">🔄</button><button class="btn-sm" data-click="remoteClose">Quitter</button></div></div>';
    html += '<div class="page-sub">Mis à jour à '+new Date(D.fetchedAt).toLocaleTimeString("fr-FR")+' · actualisation automatique chaque minute</div>';
    html += '<div class="form-field" style="margin-bottom:16px;"><select id="remoteBoutique" data-change="remoteBoutique"><option value="all">Toutes les boutiques</option>';

    prods.slice().sort(function(a,b){ return (a.qty-a.min_stock)-(b.qty-b.min_stock); }).forEach(function(x){
      html += '<tr><td>'+esc(x.name)+'</td><td>'+esc(bname[x.boutique_id]||"")+'</td><td class="num">'+x.qty+'</td><td>'+(x.qty<=0?'<span class="tag tag-low">Rupture</span>':x.qty<=x.min_stock?'<span class="tag tag-low">Faible</span>':'<span class="tag tag-ok">OK</span>')+'</td></tr>';

async function remoteLoad(silent){
  var R = state.remote, sb = getSb();
  if (!sb || !R.businessId) return;
  try{
    var start = new Date(); start.setHours(0,0,0,0);
    var bid = R.businessId;
    var q = await Promise.all([
      sb.from('boutiques').select('id, name').eq('business_id', bid),
      sb.from('products').select('id, boutique_id, name, qty, min_stock').eq('business_id', bid).order('name'),
      sb.from('sales').select('boutique_id, product_id, employee_name, type, total, created_at').eq('business_id', bid).order('created_at', { ascending:false }).limit(60),
      sb.from('sales').select('boutique_id, total').eq('business_id', bid).gte('created_at', start.toISOString()).limit(5000)
    ]);
    for (var i=0;i<q.length;i++){ if (q[i].error) throw q[i].error; }
    R.data = { boutiques:q[0].data||[], products:q[1].data||[], recent:q[2].data||[], today:q[3].data||[], fetchedAt:nowISO() };
    R.stage = "view"; R.error = null;
  }catch(e){
    if (!silent){ R.error = "Chargement impossible : "+((e && e.message)||"réessayez"); }
  }
  R.loading = false;
  if (state.remote === R && R.active) render();
}
function remoteStop(){ clearInterval(remoteTimer); remoteTimer = null; }

    var nomRaw = ((document.getElementById("loginNomComplet")||{}).value || "").trim();

    var id = idRaw.toLowerCase();
    var selectedRole = state.loginRole;

    if (!id){ state.loginError = "Entrez votre identifiant."; render(); return; }
    if (id === (state.data.adminUsername||"admin").toLowerCase()){
      if (selectedRole !== "admin"){
        state.loginError = "Ce compte est un compte Patron — choisissez \"Patron\" comme rôle.";
        render();
        return;
      }
      if (pass === state.data.patronPin){
        state.user = { role:"admin", name:"Administrateur", boutiqueId:null };
        state.tab = null;
        state.activeBoutiqueId = "all";
        state.loginError = null;
        if (state.data.cloud && state.data.cloud.linked) trySignInCloud(state.data.cloud.loginEmail, pass);
      } else {
        state.loginError = "Identifiant ou mot de passe incorrect.";
      }
      render();
      return;
    }
    var emp = state.data.employees.filter(function(e){ return (e.username||"").toLowerCase()===id; })[0];
    if (!emp){
      state.loginError = "Code d'identification ou mot de passe incorrect.";
      render();
      return;
    }
    if (emp.role !== selectedRole){
      state.loginError = "Ce compte est enregistré comme \""+(ROLE_LABELS[emp.role]||emp.role)+"\" — choisissez ce rôle pour vous connecter.";
      render();
      return;
    }
    if (!nomRaw || nomRaw.toLowerCase().trim() !== (emp.name||"").toLowerCase().trim()){
      state.loginError = "Le nom complet ne correspond pas à ce code d'identification.";
      render();
      return;
    }
    var boutique = state.data.boutiques.filter(function(b){ return b.id===emp.boutiqueId; })[0];
    var codeOk = boutique && codeRaw && boutique.code.toLowerCase() === codeRaw.toLowerCase();
    if (!codeOk){
      state.loginError = "Code boutique incorrect pour cet identifiant.";
      render();
      return;
    }
    var firstTimeSetup = !emp.password;
    if (firstTimeSetup){
      if (!pass || pass.length < 4){
        state.loginError = "Première connexion : choisissez un mot de passe personnel (4 caractères minimum).";
        render();
        return;
      }
      emp.password = pass;
    } else if (pass !== emp.password){
      state.loginError = "Code d'identification ou mot de passe incorrect.";
      render();
      return;
    }
    emp.lastLogin = nowISO();
    saveData();
    state.user = { role: emp.role, name: emp.name, boutiqueId: emp.boutiqueId, employeeId: emp.id };

    var s = d.sales.filter(function(x){return x.id===id;})[0];
    if (!s || s.returned) return;
    if (s.employeeId !== u.employeeId) return;
    var p = d.products.filter(function(x){return x.id===s.productId;})[0];
    var mv = null;
    if (p){
      p.qty = p.qty + s.qty;
      mv = { id:uid(), boutiqueId:s.boutiqueId, productId:s.productId, type:"retour", qty:s.qty, note:"Retour vente", by:u.name, timestamp:nowISO() };
      d.stockMovements.push(mv);
    }
    s.returned = true;
    s.returnedAt = nowISO();
    saveData();
    toast("Article retourné, stock mis à jour");
    render();
    if (mv) trySyncMovementToCloud(mv);
    if (p) trySyncProductToCloud(p);
  },
  openStockAdjust: function(el){
    var id = el.getAttribute("data-id");
    var p = state.data.products.filter(function(x){return x.id===id;})[0];
    if (!p) return;
    if (state.user.role !== "admin" && p.boutiqueId !== state.user.boutiqueId) return;
    state.stockAdjust = { productId: id };
    render();
  },
  closeStockAdjust: function(el, ev){
    if (ev && ev.target !== ev.currentTarget) return;
    state.stockAdjust = null;
    render();
  },
  saveStockAdjust: function(el){
    var id = el.getAttribute("data-id");
    var d = state.data;
    var p = d.products.filter(function(x){return x.id===id;})[0];
    if (!p) return;
    if (state.user.role !== "admin" && p.boutiqueId !== state.user.boutiqueId) return;
    var delta = parseInt(document.getElementById("sa_delta").value, 10);
    if (!delta){ toast("Entrez une quantité"); return; }
    var type = document.getElementById("sa_type").value;
    var note = (document.getElementById("sa_note").value||"").trim();
    p.qty = Math.max(0, p.qty + delta);
    var mv = { id:uid(), boutiqueId:p.boutiqueId, productId:p.id, type:type, qty:delta, note:note, by:state.user.name, timestamp:nowISO() };
    d.stockMovements.push(mv);
    saveData();
    state.stockAdjust = null;
    toast("Stock mis à jour");
    render();
    trySyncMovementToCloud(mv);
    trySyncProductToCloud(p);
  },
  openProductModal: function(el){
    var id = el.getAttribute("data-id");
    var p = id ? state.data.products.filter(function(x){return x.id===id;})[0] : null;
    if (id && p && state.user.role !== "admin" && p.boutiqueId !== state.user.boutiqueId) return;
    state.modal = { productId: id || null };
    state.modalPhoto = p ? (p.photo || null) : null;
    render();
  },
  closeModal: function(el, ev){
    if (ev && ev.target !== ev.currentTarget) return;
    state.modal = null;
    state.modalPhoto = null;
    render();
  },
  removePhoto: function(){
    state.modalPhoto = null;
    var preview = document.getElementById("pf_photo_preview");
    if (preview) preview.innerHTML = '<span style="font-size:24px;">📦</span>';
    var removeWrap = document.getElementById("pf_photo_remove_wrap");
    if (removeWrap) removeWrap.innerHTML = "";
  },
  stop: function(){ /* click inside modal — no-op, prevents overlay close */ },
  saveProduct: function(el){
    var id = el.getAttribute("data-id");
    var d = state.data;
    var payload = {
      name: (document.getElementById("pf_name").value||"").trim(),
      code: (document.getElementById("pf_code").value||"").trim(),
      category: (document.getElementById("pf_category").value||"").trim(),
      prixAchat: Number(document.getElementById("pf_prixAchat").value)||0,
      prixVente: Number(document.getElementById("pf_prixVente").value)||0,
      qty: Number(document.getElementById("pf_qty").value)||0,
      seuilMin: Number(document.getElementById("pf_seuilMin").value)||0,
      fournisseur: (document.getElementById("pf_fournisseur").value||"").trim(),
      boutiqueId: document.getElementById("pf_boutiqueId").value,
      photo: state.modalPhoto || null
    };
    if (state.user.role !== "admin") payload.boutiqueId = state.user.boutiqueId;
    if (!payload.name || !payload.boutiqueId){ toast("Nom et boutique requis"); return; }
    if (id){
      var p = d.products.filter(function(x){return x.id===id;})[0];
      if (p && state.user.role !== "admin" && p.boutiqueId !== state.user.boutiqueId){ toast("Ce produit n'appartient pas à votre boutique"); return; }
      if (p){
        var delta = payload.qty - p.qty;
        Object.assign(p, payload);
        if (delta !== 0){
          var mv1 = { id:uid(), boutiqueId:p.boutiqueId, productId:p.id, type:"ajustement", qty:delta, note:"Modification produit", by:state.user.name, timestamp:nowISO() };
          d.stockMovements.push(mv1);
          trySyncMovementToCloud(mv1);
        }
        trySyncProductToCloud(p);
      }
      toast("Produit mis à jour");
    } else {
      var newP = Object.assign({ id:uid() }, payload);
      d.products.push(newP);
      var mv2 = { id:uid(), boutiqueId:newP.boutiqueId, productId:newP.id, type:"création", qty:newP.qty, note:"Nouveau produit", by:state.user.name, timestamp:nowISO() };
      d.stockMovements.push(mv2);
      toast("Produit ajouté");
      trySyncProductToCloud(newP).then(function(){ trySyncMovementToCloud(mv2); });
    }
    saveData();
    state.modal = null;
    state.modalPhoto = null;
    render();
  },
  deleteProduct: function(el){
    if (state.user.role !== "admin") return;
    var id = el.getAttribute("data-id");
    state.data.products = state.data.products.filter(function(p){return p.id!==id;});
    saveData();
    toast("Produit supprimé");
  },
  addBoutique: function(){
    var input = document.getElementById("newBoutiqueName");
    var name = (input.value||"").trim();
    if (!name) return;
    var address = (document.getElementById("newBoutiqueAddress").value||"").trim();
    var existingCodes = state.data.boutiques.map(function(b){return b.code;});
    var code = genBoutiqueCode(name, existingCodes);
    var newB = { id:uid(), name:name, address:address, code:code };
    state.data.boutiques.push(newB);
    saveData();
    toast("Boutique ajoutée — code : "+code);
    render();
    trySyncBoutiqueToCloud(newB);
  },
  addEmployee: function(){
    if (state.user.role !== "admin") return;
    var name = (document.getElementById("newEmpName").value||"").trim();
    var boutiqueId = document.getElementById("newEmpBoutique").value;
    var role = document.getElementById("newEmpRole").value;
    if (!name){ toast("Nom complet requis"); return; }
    var boutique = state.data.boutiques.filter(function(b){return b.id===boutiqueId;})[0];
    if (!boutique){ toast("Boutique invalide"); return; }
    var existingCodes = state.data.employees.map(function(e){return e.username;});
    var username = genEmployeeCode(boutique.code, role, existingCodes);
    var newEmp = { id:uid(), name:name, username:username, boutiqueId:boutiqueId, password:null, role:role };
    state.data.employees.push(newEmp);
    saveData();
    toast("Employé ajouté — code : "+username+" (définira son mot de passe à la 1ère connexion)");
    render();
  },
  deleteEmployee: function(el){
    if (state.user.role !== "admin") return;
    var id = el.getAttribute("data-id");
    var emp = state.data.employees.filter(function(e){return e.id===id;})[0];
    state.data.employees = state.data.employees.filter(function(e){return e.id!==id;});
    saveData();
    render();
    if (emp && emp.cloudMembershipId) tryDeleteEmployeeInCloud(emp.cloudMembershipId);
  },
  saveEntreprise: function(){
    var name = (document.getElementById("entNameSetting").value||"").trim();
    if (!name){ toast("Le nom de l'entreprise ne peut pas être vide"); return; }
    state.data.entrepriseName = name;
    state.data.devise = document.getElementById("entDeviseSetting").value;
    state.data.patronPays = document.getElementById("entPaysSetting").value;
    saveData();
    toast("Informations de l'entreprise mises à jour");
    render();
  },
  savePatronPin: function(){
    var username = (document.getElementById("adminUsernameSetting").value||"").trim();
    var pin = document.getElementById("patronPinSetting").value;
    if (!username){ toast("L'identifiant ne peut pas être vide"); return; }
    if (state.data.employees.some(function(e){return (e.username||"").toLowerCase()===username.toLowerCase();})){
      toast("Cet identifiant est déjà utilisé par un employé"); return;
    }
    state.data.adminUsername = username;
    state.data.patronPin = pin;
    saveData();
    toast("Identifiants mis à jour");
    render();
  },
  exportCsv: function(){
    var d = state.data, ab = state.activeBoutiqueId;
    var scope = ab==="all" ? d.sales : d.sales.filter(function(s){return s.boutiqueId===ab;});
    var sorted = scope.slice().reverse();
    var rows = [["Date","Boutique","Employé","Produit","Quantité","Montant"]];
    sorted.forEach(function(s){
      var p = d.products.filter(function(x){return x.id===s.productId;})[0];
      var b = d.boutiques.filter(function(x){return x.id===s.boutiqueId;})[0];
      rows.push([new Date(s.timestamp).toLocaleString("fr-FR"), b?b.name:"", s.employeeName, p?p.name:"Produit supprimé", s.qty, s.total]);
    });
    var csv = rows.map(function(r){
      return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(",");
    }).join("\n");
    var blob = new Blob(["\ufeff"+csv], { type:"text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "smartstock_ventes.csv"; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ if (a.parentNode) a.parentNode.removeChild(a); URL.revokeObjectURL(url); }, 1500);
  }
};

document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-click]");
  if (!el) return;
  var name = el.getAttribute("data-click");
  if (name === "closeModal" && el.getAttribute("data-selfonly")){
    if (ev.target !== el) return;
  }
  var fn = actions[name];
  if (fn){
    try{ fn(el, ev); }
    catch(err){
      var root = document.getElementById("root");
      if (root) root.innerHTML =
        '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ink);color:#fff;padding:24px;text-align:center;">' +
        '<div style="font-family:var(--font-display);font-weight:800;font-size:20px;margin-bottom:10px;">Une erreur est survenue</div>' +
        '<div style="font-family:var(--font-mono);font-size:12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:14px;max-width:500px;white-space:pre-wrap;text-align:left;margin-bottom:16px;">' + esc(err && err.message ? err.message : String(err)) + '</div>' +
        '<button class="btn btn-primary" style="width:auto;" onclick="window.__ss_recover()">Retour à la connexion</button>' +
        '</div>';
    }
  }
});

document.addEventListener("change", function(ev){
  var el = ev.target.closest("[data-change]");
  if (!el) return;
  var fn = actions[el.getAttribute("data-change")];
  if (fn) fn(el, ev);
});

document.addEventListener("keydown", function(ev){
  if (ev.key === "Enter"){
    if (ev.target.id === "loginUsername" || ev.target.id === "loginPassword" || ev.target.id === "loginBoutiqueCode") actions.submitLogin();
    if (ev.target.id === "newBoutiqueName") actions.addBoutique();
    if (ev.target.id === "remotePass" || ev.target.id === "remoteId") actions.remoteLogin();
  }
});

render();
})();
</script>
</body>
</html>
