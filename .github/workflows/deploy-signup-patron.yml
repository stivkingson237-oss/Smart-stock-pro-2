name: Deploy signup-patron to Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/signup-patron/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-signup-patron.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-signup-patron-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy signup-patron
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: lmnclimprmgynfbfciih
    steps:
      - name: Check required secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate function source
        run: deno check supabase/functions/signup-patron/index.ts

      - name: Deploy only signup-patron
        run: supabase functions deploy signup-patron --project-ref "$SUPABASE_PROJECT_ID" --use-api --yes
