name: Deploy activate-employee to Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: lmnclimprmgynfbfciih
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/multi-role-cloud-login
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check deployment credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
      - name: Deploy activate-employee
        run: supabase functions deploy activate-employee --project-ref "$SUPABASE_PROJECT_ID" --use-api
