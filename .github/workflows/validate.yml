name: Validate Smart Stock Pro 2

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Functions
        run: |
          for file in supabase/functions/*/index.ts; do
            echo "Checking $file"
            deno check "$file"
          done

      - name: Check inline JavaScript in index.html
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(match => !/\bsrc\s*=/.test(match[1]))
            .map(match => match[2])
            .filter(code => code.trim());
          if (!scripts.length) throw new Error('No inline JavaScript found in index.html');
          scripts.forEach((code, index) => {
            new Function(code);
            console.log('Inline script ' + (index + 1) + ': syntax OK');
          });
          NODE

      - name: Verify SasPay reliability safeguards
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const init = fs.readFileSync('supabase/functions/initiate-payment/index.ts', 'utf8');
          const hook = fs.readFileSync('supabase/functions/saspay-webhook/index.ts', 'utf8');
          const poll = fs.readFileSync('supabase/functions/check-subscription-payment/index.ts', 'utf8');
          const migration = fs.readFileSync('supabase/migrations/202611200001_saspay_subscriptions.sql', 'utf8');
          const checks = [
            ['stable request idempotency', init.includes('request_id') && init.includes('"Idempotency-Key": idempotencyKey')],
            ['uncertain outcomes stay pending', init.includes('Résultat réseau SasPay incertain')],
            ['webhook retries unmatched payment', hook.includes('Réessayez la livraison.') && hook.includes('}, 503)')],
            ['provider status verification', poll.includes('/verify/')],
            ['single pending payment per business', migration.includes('subscription_payments_one_pending_per_business_uidx')],
            ['late success can still activate', migration.includes("not in ('PENDING', 'FAILED')")]
          ];
          for (const [name, ok] of checks) { console.log((ok ? 'PASS ' : 'FAIL ') + name); if (!ok) process.exitCode = 1; }
          NODE
