name: Validate Smart Stock Pro 2

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Functions
        run: |
          for file in supabase/functions/*/index.ts; do
            echo "Checking $file"
            deno check "$file"
          done

      - name: Check inline JavaScript in index.html
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(match => !/\bsrc\s*=/.test(match[1]))
            .map(match => match[2])
            .filter(code => code.trim());
          if (!scripts.length) throw new Error('No inline JavaScript found in index.html');
          scripts.forEach((code, index) => {
            new Function(code);
            console.log('Inline script ' + (index + 1) + ': syntax OK');
          });
          NODE

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartstock_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartstock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable logical replication for Realtime publication tests
        run: |
          container_id=$(docker ps -q --filter "ancestor=postgres:16" | head -n1)
          docker exec "$container_id" psql -U postgres -d smartstock_test -c "ALTER SYSTEM SET wal_level = 'logical';"
          docker restart "$container_id"
          for attempt in $(seq 1 30); do
            if docker exec "$container_id" pg_isready -U postgres -d smartstock_test; then break; fi
            sleep 2
          done

      - name: Prepare minimal Supabase auth schema
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/smartstock_test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; END IF;
          END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY);
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE AS $$
              SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
            $$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO anon, authenticated, service_role;
          CREATE PUBLICATION supabase_realtime;
          SQL

      - name: Apply base schema and migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/smartstock_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202611210001_snapshot_realtime.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202611210002_operational_sync.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202611220001_owner_notifications.sql

      - name: Test RLS, atomic stock changes, retries, returns and cash events
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/smartstock_test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/multidevice_sync.sql

      - name: Verify migrations are idempotent
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/smartstock_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202611210001_snapshot_realtime.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202611210002_operational_sync.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202611220001_owner_notifications.sql
